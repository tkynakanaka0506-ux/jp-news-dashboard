name: Update JP Daytrade Dashboard

on:
  schedule:
    # GitHub Actionsのscheduled runは、公式ドキュメント上も「高負荷時には
    # 遅延・ドロップされることがある」仕様(実際に本番でも、cronの間隔通りに
    # 動いていない期間が観測されている)。原因を確定はできないが、緩和策として
    # 行数を減らし・実行間隔を広げ・毎時0分ちょうど(混雑しやすい分)を避ける形にする。
    #
    # 日本市場時間帯(8:30〜15:30 JST)は30分おき(morning扱い)。
    # 7分/37分にずらすことで毎時0分・30分ちょうどの集中を避ける。
    - cron: '7,37 23,0-6 * * *'  # 23,0-6時UTC:07,:37 = 8:07〜15:37 JST(30分おき)
    # それ以外の時間帯は2時間おき(evening扱い)。同じ理由で毎時7分にずらす。
    - cron: '7 7,9,11,13,15,17,19,21 * * *'  # 16:07,18:07,20:07,22:07,0:07,2:07,4:07,6:07 JST
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モード(morning または evening)'
        required: false
        default: 'morning'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: mainが最新パイプライン(newssite)を持っているか確認(再発防止カナリア)
        run: |
          # 2026-09-13〜19、サイト刷新〜Policy Catalyst一式が作業ブランチに
          # 積まれたままmainにマージされず、本番はそれと知らずに1週間分
          # 古いコードを"成功"扱いで自動更新し続けていた事故の再発防止。
          # newssite/が無い=作業ブランチがmainに反映されないまま停滞している
          # 可能性が高いので、ここで気づかず成功させずに明示的に失敗させる。
          test -f newssite/policy_lifecycle.py || {
            echo "::error::newssite/policy_lifecycle.py が見つかりません。"
            echo "::error::mainが開発ブランチとマージされないまま停滞している可能性があります。"
            echo "::error::git branch -r で他のブランチの状況を確認してください。"
            exit 1
          }

      - name: 実行モードを判定
        id: mode
        run: |
          SCHED="${{ github.event.schedule }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "$SCHED" = "7,37 23,0-6 * * *" ]; then
            # 日本市場時間帯(8:07〜15:37 JST)の30分おき実行 → morning扱い
            echo "mode=morning" >> "$GITHUB_OUTPUT"
          else
            # それ以外の2時間おき実行 → evening扱い
            echo "mode=evening" >> "$GITHUB_OUTPUT"
          fi

      - name: Java 21 セットアップ
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Python セットアップ(HTML生成用・ネットワーク不要)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 構文チェック(軽量)
        run: python3 -m py_compile build_news_site.py dev.py newssite/*.py

      - name: ニュース判定ロジックのテスト
        run: python3 -m unittest discover -s tests

      - name: Javaプログラムをビルド
        run: mvn -q -B package

      - name: データ取得・data.json更新(Java・決定論的な部分)
        env:
          # EDINET APIはVersion 2から利用登録(無料)+APIキーが必須。未設定でも他の処理は継続する
          # (大量保有報告書チェックのみスキップされる)。
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: java -jar target/dashboard-updater.jar "${{ steps.mode.outputs.mode }}" data.json

      - name: ニュース分析・話題株選定(Python + Gemini無料枠・任意)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 news_analyzer.py "${{ steps.mode.outputs.mode }}" data.json

      - name: 重要ニュースサイトを生成(index.html)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 build_news_site.py

      - name: 旧デイトレードダッシュボードを生成(dashboard.html・アーカイブ用)
        run: python3 render_dashboard.py data.json dashboard.html

      - name: 最注力銘柄をLINEへ通知(任意・条件を満たす銘柄がある場合のみ)
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python3 notify_line.py data.json

      - name: 差分があれば強制Push
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"

          # 実測バグ(2026-09-20発見、複数回再発): newssite/data/
          # policy_event_registry.jsonがgit reset --hardで退避されず消え、
          # 「続報(UPDATE)」判定が本番で一度も機能していなかった。調査の
          # 過程でbacktest_events.jsonl・policy_catalyst_signals.jsonにも
          # 同じ穴が見つかった――ファイルが増えるたびに、退避(cp)・復元
          # (mv)・git addの3箇所すべてに書き足す必要があり、1箇所でも
          # 書き忘れると同じ事故が再発する構造だった。
          #
          # そのため、日をまたいで状態を持つ全ファイルをPERSISTENT_FILES
          # 1箇所にまとめ、退避→reset→復元→addをループで一括処理する形に
          # 統一した(2026-09-20ユーザー要望「永続化対象ファイルの管理を
          # 一元化」)。新しいレジストリ/履歴ファイルを追加するときは、
          # この配列に1行足すだけでよい。
          GENERATED_FILES=(
            "data.json"
            "news.json"
            "index.html"
            "dashboard.html"
          )
          PERSISTENT_STATE_FILES=(
            "newssite/data/policy_event_registry.json"
            "newssite/data/theme_trend_registry.json"
            "newssite/data/theme_trend_history.jsonl"
            "newssite/data/backtest_events.jsonl"
            "newssite/data/policy_catalyst_signals.json"
          )
          ALL_PERSISTED_FILES=("${GENERATED_FILES[@]}" "${PERSISTENT_STATE_FILES[@]}")

          STASH_DIR="$(mktemp -d)"
          for f in "${ALL_PERSISTED_FILES[@]}"; do
            mkdir -p "$(dirname "$f")"
            touch "$f"
            mkdir -p "$STASH_DIR/$(dirname "$f")"
            cp "$f" "$STASH_DIR/$f"
          done

          # リモートの最新状態を強制的に取得してリセット
          git fetch origin main
          git reset --hard origin/main

          # 退避していたファイルを全て戻す
          for f in "${ALL_PERSISTED_FILES[@]}"; do
            mkdir -p "$(dirname "$f")"
            cp "$STASH_DIR/$f" "$f"
          done
          rm -rf "$STASH_DIR"

          git add "${ALL_PERSISTED_FILES[@]}"

          if ! git diff --cached --quiet; then
            git commit -m "Auto update (Force)"
            git push origin main --force
          else
            echo "No changes to commit."
          fi
